<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020913"/><stop offset="1" stop-color="#061725"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="430" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="428" rx="23" fill="none" stroke="#173b51"/><text x="42" y="44" fill="#58eaff" font-family="ui-monospace,Consolas,monospace" font-size="15" letter-spacing="3">LEVIATHAN EXAMPLES // LEARNING FLOW</text><text x="42" y="68" fill="#7d9fb2" font-family="Segoe UI,Arial" font-size="12">Examples move from one small public concept to safe configuration, expected behavior and explicit production considerations.</text><path id="p" d="M105 215 H1095" fill="none" stroke="#174c66" stroke-width="4" stroke-linecap="round"/><circle r="6" fill="#63f2ff" filter="url(#g)"><animateMotion dur="8s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle><g font-family="Segoe UI,Arial" text-anchor="middle"><g><circle cx="135" cy="215" r="47" fill="#071a26" stroke="#20bfdd" stroke-width="2"/><text x="135" y="208" fill="#eefcff" font-size="13" font-weight="750">CONCEPT</text><text x="135" y="226" fill="#7f9fb0" font-size="9">one public idea</text></g><g><circle cx="335" cy="215" r="47" fill="#071a26" stroke="#20bfdd" stroke-width="2"/><text x="335" y="208" fill="#eefcff" font-size="13" font-weight="750">RUNNABLE</text><text x="335" y="226" fill="#7f9fb0" font-size="9">small example</text></g><g><circle cx="535" cy="215" r="47" fill="#071a26" stroke="#8174ff" stroke-width="2"/><text x="535" y="208" fill="#eefcff" font-size="13" font-weight="750">CONFIG</text><text x="535" y="226" fill="#7f9fb0" font-size="9">placeholder data</text></g><g><circle cx="735" cy="215" r="47" fill="#071a26" stroke="#8174ff" stroke-width="2"/><text x="735" y="208" fill="#eefcff" font-size="13" font-weight="750">EXPECTED</text><text x="735" y="226" fill="#7f9fb0" font-size="9">request / event / result</text></g><g><circle cx="935" cy="215" r="47" fill="#071a26" stroke="#43d9a3" stroke-width="2"/><text x="935" y="208" fill="#eefcff" font-size="13" font-weight="750">DEFENSIVE</text><text x="935" y="226" fill="#7f9fb0" font-size="9">errors + validation</text></g><g><circle cx="1080" cy="215" r="47" fill="#061a28" stroke="#36e4f7" stroke-width="2.5" filter="url(#g)"/><text x="1080" y="203" fill="#eefcff" font-size="12" font-weight="750">PRODUCTION</text><text x="1080" y="220" fill="#eefcff" font-size="12" font-weight="750">CHECKLIST</text><text x="1080" y="238" fill="#62dce9" font-size="8">not automatic approval</text></g></g><text x="600" y="335" text-anchor="middle" fill="#65889b" font-family="ui-monospace,Consolas,monospace" font-size="10">PLACEHOLDERS ONLY • NO REAL TOKENS • NO PRIVATE ENDPOINTS • SECURITY AND ERROR HANDLING REQUIRED</text><rect x="4" y="4" width="1192" height="422" rx="22" fill="none" stroke="#0b3346" stroke-width="1.5"/><rect x="4" y="4" width="1192" height="422" rx="22" fill="none" stroke="#32efff" stroke-width="3" stroke-dasharray="380 1500" filter="url(#g)" opacity=".9"><animate attributeName="stroke-dashoffset" values="0;-1880" dur="9s" repeatCount="indefinite"/></rect></svg>